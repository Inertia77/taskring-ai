name: WP008 Dependency Bootstrap

on:
  push:
    branches:
      - feature/wp008-offline-action-outbox
    paths:
      - package.json
      - .github/workflows/wp008-dependency-bootstrap.yml

permissions:
  contents: write

jobs:
  lock-and-self-delete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Refresh lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git rm .github/workflows/wp008-dependency-bootstrap.yml
          git commit -m 'WP008: lock IndexedDB dependencies'
          git push
