name: WP005 Test Query Fix

on:
  push:
    branches:
      - feature/wp005-task-project-management

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Make label queries resilient to help and error text
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/taskProjectManagement.test.tsx')
          text = path.read_text()
          text = text.replace("getByLabelText('Title')", "getByLabelText(/^Title/)")
          text = text.replace("getByLabelText('Management status')", "getByLabelText(/^Management status/)")
          path.write_text(text)
          Path('.github/workflows/wp005-test-query-fix.yml').unlink()
      - name: Commit test query fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/taskProjectManagement.test.tsx .github/workflows/wp005-test-query-fix.yml
          git commit -m 'WP005: make management label tests semantic'
          git push
