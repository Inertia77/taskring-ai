name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify PWA artifacts and offline boundary
        run: pnpm test:pwa

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Requested repository keyword audit
        shell: bash
        run: |
          set -euo pipefail
          p1="service""_role"
          p2="sec""ret"
          p3="gh""p_"
          p4="github""_pat_"
          p5="rubjeqnuxu""vupjwyksmo"
          p6="d9abf0fb69a47f7c""4114be3930894c65"
          for pattern in "$p1" "$p2" "$p3" "$p4" "$p5" "$p6"; do
            echo "--- requested audit pattern ---"
            git grep -n -i -- "${pattern}" || true
          done

      - name: Reject credential signatures and prohibited legacy identifiers
        shell: bash
        run: |
          set -euo pipefail
          token_a="gh""p_"
          token_b="github""_pat_"
          token_c="sb_""sec""ret_"
          privileged_key="SUPABASE_SERVICE_""ROLE_KEY"
          sensitive_word="SEC""RET"
          role_word="SERVICE_""ROLE"
          vite_sensitive="VITE_[A-Za-z0-9_]*(${sensitive_word}|${role_word}|DB_PASSWORD)"
          legacy_a="rubjeqnuxu""vupjwyksmo"
          legacy_b="d9abf0fb69a47f7c""4114be3930894c65"
          forbidden="${token_a}[A-Za-z0-9]{20,}|${token_b}[A-Za-z0-9_]{20,}|${token_c}[A-Za-z0-9_-]{10,}|${privileged_key}|${vite_sensitive}|${legacy_a}|${legacy_b}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"
          if git grep -n -E -- "${forbidden}"; then
            echo "Potential credential or prohibited Legacy identifier found."
            exit 1
          fi
          echo "No credential signatures or prohibited Legacy identifiers found."

      - name: Reject unsafe Auth/RLS shortcuts
        shell: bash
        run: |
          set -euo pipefail
          migration_files="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print)"
          test -n "$migration_files"
          forbidden='auth\.role\(|user_metadata|SECURITY[[:space:]]+DEFINER|USING[[:space:]]*\([[:space:]]*true[[:space:]]*\)'
          if grep -Ein -- "$forbidden" $migration_files; then
            echo "Unsafe Auth/RLS shortcut found."
            exit 1
          fi
          if git grep -n -E 'console\.(log|error|warn).*\b(access_token|refresh_token|password|session)\b' -- src; then
            echo "Sensitive Auth logging pattern found in frontend source."
            exit 1
          fi

  supabase-local:
    name: Supabase Local Reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify CLI and config
        run: |
          pnpm exec supabase --version
          test -f supabase/config.toml
          test -d supabase/migrations
          test -d supabase/functions
          test -f supabase/functions/secretary-api/index.ts
          test -f supabase/functions/secretary-api/contract.ts
          test -d supabase/tests
          test -f supabase/seed.sql
          grep -F 'site_url = "http://localhost:5173"' supabase/config.toml
          grep -F 'enable_anonymous_sign_ins = false' supabase/config.toml

      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Rebuild local database from migrations and seed
        run: pnpm exec supabase db reset --local

      - name: Run pgTAP schema and RLS tests
        run: pnpm exec supabase test db

      - name: Lint local database
        run: pnpm exec supabase db lint --level error --schema public

      - name: Start local Secretary API
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec supabase functions serve secretary-api > /tmp/secretary-api.log 2>&1 &
          echo "$!" > /tmp/secretary-api.pid
          for attempt in $(seq 1 45); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://127.0.0.1:54321/functions/v1/secretary-api || true)"
            if [ "$status" = "401" ]; then
              echo "Secretary API ready with unauthenticated requests rejected."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/secretary-api.log
          exit 1

      - name: Real Auth, Data API, Secretary, Daily Plan, Execution, and Offline Outbox integration
        shell: bash
        run: |
          set -euo pipefail
          env_file="$(mktemp)"
          pnpm exec supabase status -o env > "$env_file"
          api_url="$(sed -n 's/^API_URL="\([^"]*\)"$/\1/p' "$env_file")"
          publishable_key="$(sed -n 's/^PUBLISHABLE_KEY="\([^"]*\)"$/\1/p' "$env_file")"
          if [ -z "$publishable_key" ]; then
            publishable_key="$(sed -n 's/^ANON_KEY="\([^"]*\)"$/\1/p' "$env_file")"
          fi
          rm -f "$env_file"
          test -n "$api_url"
          test -n "$publishable_key"
          VITE_SUPABASE_URL="$api_url" VITE_SUPABASE_PUBLISHABLE_KEY="$publishable_key" \
            pnpm exec vitest run tests/authDataApi.integration.test.ts tests/secretaryApi.integration.test.ts tests/dailyPlanRpc.integration.test.ts tests/executionRpc.integration.test.ts tests/offlineSync.integration.test.ts

      - name: Verify generated database types are current
        shell: bash
        run: |
          set -euo pipefail
          tmp_file="$(mktemp)"
          pnpm exec supabase gen types typescript --local > "$tmp_file"
          diff -u src/types/database.types.ts "$tmp_file"

      - name: Stop local Supabase
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/secretary-api.pid ]; then
            kill "$(cat /tmp/secretary-api.pid)" 2>/dev/null || true
          fi
          pnpm exec supabase stop --no-backup
