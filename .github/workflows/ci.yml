name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Requested repository keyword audit
        shell: bash
        run: |
          set -euo pipefail
          for pattern in \
            service_role \
            secret \
            ghp_ \
            github_pat_ \
            rubjeqnuxuvupjwyksmo \
            d9abf0fb69a47f7c4114be3930894c65
          do
            echo "--- audit: ${pattern} ---"
            git grep -n -i -- "${pattern}" || true
          done

      - name: Reject credential signatures and prohibited legacy identifiers
        shell: bash
        run: |
          set -euo pipefail
          forbidden='ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sb_secret_[A-Za-z0-9_-]{10,}|SUPABASE_SERVICE_ROLE_KEY|VITE_[A-Za-z0-9_]*(SECRET|SERVICE_ROLE|DB_PASSWORD)|rubjeqnuxuvupjwyksmo|d9abf0fb69a47f7c4114be3930894c65|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
          if git grep -n -E -- "${forbidden}"; then
            echo "Potential credential or prohibited Legacy identifier found."
            exit 1
          fi
          echo "No credential signatures or prohibited Legacy identifiers found."

  supabase-local:
    name: Supabase Local Reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify CLI and config
        run: |
          pnpm exec supabase --version
          test -f supabase/config.toml
          test -d supabase/migrations
          test -d supabase/functions
          test -d supabase/tests
          test -f supabase/seed.sql

      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Rebuild local database from migrations and seed
        run: pnpm exec supabase db reset --local

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
