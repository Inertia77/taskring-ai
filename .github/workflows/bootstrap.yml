name: Bootstrap Generator

on:
  push:
    branches:
      - bootstrap/wp001

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/wp001

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and generate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Initialize Supabase CLI config
        run: pnpm exec supabase init --force

      - name: Verify generated CLI config
        run: |
          pnpm exec supabase --version
          test -f pnpm-lock.yaml
          test -f supabase/config.toml

      - name: Commit generated reproducibility files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml supabase/config.toml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: generate lockfile and Supabase config"
          git push origin HEAD:bootstrap/wp001
