name: WP006 Migration Bootstrap

on:
  push:
    branches:
      - feature/wp006-today-daily-plan

permissions:
  contents: write

jobs:
  generate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate real Supabase migration
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec supabase migration new publish_daily_plan_v01
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_publish_daily_plan_v01.sql' -print | sort | tail -1)"
          test -n "$migration_file"
          cp supabase/wp006_publish_daily_plan_v01.sql.source "$migration_file"
          echo "MIGRATION_FILE=$migration_file" >> "$GITHUB_ENV"
          echo "Generated $migration_file"

      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Rebuild and run database tests
        run: |
          pnpm exec supabase db reset --local
          pnpm exec supabase test db
          pnpm exec supabase db lint --level error --schema public

      - name: Run real Auth, Data API, and RPC integration
        shell: bash
        run: |
          set -euo pipefail
          env_file="$(mktemp)"
          pnpm exec supabase status -o env > "$env_file"
          api_url="$(sed -n 's/^API_URL="\([^"]*\)"$/\1/p' "$env_file")"
          publishable_key="$(sed -n 's/^PUBLISHABLE_KEY="\([^"]*\)"$/\1/p' "$env_file")"
          if [ -z "$publishable_key" ]; then
            publishable_key="$(sed -n 's/^ANON_KEY="\([^"]*\)"$/\1/p' "$env_file")"
          fi
          rm -f "$env_file"
          test -n "$api_url"
          test -n "$publishable_key"
          VITE_SUPABASE_URL="$api_url" VITE_SUPABASE_PUBLISHABLE_KEY="$publishable_key" \
            pnpm exec vitest run tests/authDataApi.integration.test.ts tests/dailyPlanRpc.integration.test.ts

      - name: Generate database types from local schema
        run: pnpm exec supabase gen types typescript --local > src/types/database.types.ts

      - name: Stop local Supabase before frontend verification
        run: |
          pnpm exec supabase stop --no-backup
          rm -rf supabase/.temp

      - name: Verify frontend and PWA with generated types
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm test:pwa

      - name: Cleanup local Supabase after failure
        if: failure()
        run: |
          pnpm exec supabase stop --no-backup || true
          rm -rf supabase/.temp

      - name: Commit verified migration and generated types, then self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm -f supabase/wp006_publish_daily_plan_v01.sql.source
          rm -f .github/workflows/wp006-migration-bootstrap.yml
          git add supabase/migrations src/types/database.types.ts supabase/wp006_publish_daily_plan_v01.sql.source .github/workflows/wp006-migration-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'WP006: generate verified Daily Plan RPC migration and types'
          git push origin HEAD:feature/wp006-today-daily-plan
