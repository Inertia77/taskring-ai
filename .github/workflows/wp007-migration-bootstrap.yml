name: WP007 Correction Prep

on:
  push:
    branches:
      - feature/wp007-execution-events-feedback

permissions:
  contents: write

jobs:
  align-reviewed-corrections:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply reviewed corrections
        run: python scripts/wp007-correction-prep.py
      - name: Commit permanent reviewed corrections
        shell: bash
        run: |
          set -euo pipefail
          git add supabase/wp007_execution_events_feedback_v01.sql.source \
                  supabase/wp007_execution_events_feedback_v01.patch.sql.source \
                  supabase/tests/core_domain_schema.test.sql \
                  supabase/tests/execution_commands.test.sql \
                  supabase/tests/daily_plan_publication.test.sql \
                  tests/authDataApi.integration.test.ts \
                  tests/dailyPlanRpc.integration.test.ts \
                  tests/todayPage.test.tsx \
                  tests/executionRpc.integration.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'WP007: apply reviewed context and regression corrections'
          git push origin HEAD:feature/wp007-execution-events-feedback
