name: WP007 Correction Prep

on:
  push:
    branches:
      - feature/wp007-execution-events-feedback

permissions:
  contents: write

jobs:
  align-reviewed-corrections:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Permanently align WP007 sources and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch target: {label}')
              return text.replace(old, new, 1)

          # DEFECT-007-01: publish context must be restored before successful return.
          p = Path('supabase/wp007_execution_events_feedback_v01.sql.source')
          s = p.read_text()
          s = replace_once(
              s,
              "  v_position_key text;\nbegin",
              "  v_position_key text;\n  v_previous_context text := pg_catalog.current_setting('taskring.command_context', true);\nbegin",
              'publish previous context declaration',
          )
          s = replace_once(
              s,
              "  return query select v_new_plan_id, v_next_revision;\nend;",
              "  perform pg_catalog.set_config('taskring.command_context', coalesce(v_previous_context, ''), true);\n  return query select v_new_plan_id, v_next_revision;\nend;",
              'publish context restore',
          )
          p.write_text(s)

          # Final execution / feedback definitions live in the patch source.
          p = Path('supabase/wp007_execution_events_feedback_v01.patch.sql.source')
          s = p.read_text()
          s = replace_once(
              s,
              "  v_note text := nullif(pg_catalog.btrim(p_note), '');\nbegin",
              "  v_note text := nullif(pg_catalog.btrim(p_note), '');\n  v_previous_context text := pg_catalog.current_setting('taskring.command_context', true);\nbegin",
              'execution previous context declaration',
          )
          s = replace_once(
              s,
              "  return query select p_event_id;\nend;",
              "  perform pg_catalog.set_config('taskring.command_context', coalesce(v_previous_context, ''), true);\n  return query select p_event_id;\nend;",
              'execution context restore',
          )
          s = replace_once(
              s,
              "  v_content text := pg_catalog.btrim(coalesce(p_content,''));\nbegin",
              "  v_content text := pg_catalog.btrim(coalesce(p_content,''));\n  v_previous_context text := pg_catalog.current_setting('taskring.command_context', true);\nbegin",
              'feedback previous context declaration',
          )
          s = replace_once(
              s,
              "  return query select p_feedback_id;\nend;",
              "  perform pg_catalog.set_config('taskring.command_context', coalesce(v_previous_context, ''), true);\n  return query select p_feedback_id;\nend;",
              'feedback context restore',
          )
          p.write_text(s)

          # DEFECT-007-02: schema constraint fixtures get narrow postgres-only command contexts.
          p = Path('supabase/tests/core_domain_schema.test.sql')
          s = p.read_text()
          initial_start = s.index('insert into public.daily_plans (id,user_id,plan_date,revision,status,created_by) values')
          initial_end_marker = "  (current_setting('wp003.plan_item_a')::uuid,current_setting('wp003.user_a')::uuid,current_setting('wp003.plan_a')::uuid,current_setting('wp003.task_a')::uuid,'must',0,'planned');"
          initial_end = s.index(initial_end_marker, initial_start) + len(initial_end_marker)
          initial = s[initial_start:initial_end]
          wrapped = (
              "select set_config('wp007.schema_previous_context', coalesce(current_setting('taskring.command_context', true), ''), true);\n"
              "select set_config('taskring.command_context', 'publication:v1', true);\n"
              + initial +
              "\nselect set_config('taskring.command_context', current_setting('wp007.schema_previous_context'), true);"
          )
          s = s[:initial_start] + wrapped + s[initial_end:]

          fixture_pattern = re.compile(
              r"select throws_ok\(\n  \$\$insert into public\.(daily_plans|daily_plan_items|task_events)\b.*?\n\);",
              re.S,
          )
          def wrap_fixture(match):
              table = match.group(1)
              context = 'execution:v1' if table == 'task_events' else 'publication:v1'
              return (
                  "select set_config('wp007.schema_previous_context', coalesce(current_setting('taskring.command_context', true), ''), true);\n"
                  f"select set_config('taskring.command_context', '{context}', true);\n"
                  + match.group(0) +
                  "\nselect set_config('taskring.command_context', current_setting('wp007.schema_previous_context'), true);"
              )
          s, fixture_count = fixture_pattern.subn(wrap_fixture, s)
          if fixture_count != 7:
              raise SystemExit(f'expected 7 guarded schema constraint fixtures, found {fixture_count}')
          p.write_text(s)

          # Permanently align execution pgTAP with expected_state and add context-restoration regressions.
          p = Path('supabase/tests/execution_commands.test.sql')
          s = p.read_text()
          s = s.replace(
              'public.record_task_action_v01(uuid,uuid,text,timestamptz,numeric,integer,integer,text,text)',
              'public.record_task_action_v01(uuid,uuid,text,text,timestamptz,numeric,integer,integer,text,text)',
          )
          replacements = [
              ("current_setting('wp007.event_done')::uuid,current_setting('wp007.item_a1')::uuid,'done','2026-08-28T09:00:00Z'", "current_setting('wp007.event_done')::uuid,current_setting('wp007.item_a1')::uuid,'planned','done','2026-08-28T09:00:00Z'"),
              ("current_setting('wp007.event_done')::uuid,current_setting('wp007.item_a1')::uuid,'done','2026-08-28T10:00:00Z'", "current_setting('wp007.event_done')::uuid,current_setting('wp007.item_a1')::uuid,'planned','done','2026-08-28T09:00:00Z'"),
              ("current_setting('wp007.event_done')::uuid,current_setting('wp007.item_a1')::uuid,'reopened',now()", "current_setting('wp007.event_done')::uuid,current_setting('wp007.item_a1')::uuid,'done','reopened',now()"),
              ("gen_random_uuid(),current_setting('wp007.item_a1')::uuid,'partial',now(),50", "gen_random_uuid(),current_setting('wp007.item_a1')::uuid,'done','partial',now(),50"),
              ("gen_random_uuid(),current_setting('wp007.item_a1')::uuid,'reopened',now()", "gen_random_uuid(),current_setting('wp007.item_a1')::uuid,'done','reopened',now()"),
              ("gen_random_uuid(),current_setting('wp007.item_a1')::uuid,'blocked',now()", "gen_random_uuid(),current_setting('wp007.item_a1')::uuid,'started','blocked',now()"),
              ("gen_random_uuid(),current_setting('wp007.item_a2')::uuid,'partial',now(),40", "gen_random_uuid(),current_setting('wp007.item_a2')::uuid,'planned','partial',now(),40"),
              ("gen_random_uuid(),current_setting('wp007.item_a2')::uuid,'partial',now(),100", "gen_random_uuid(),current_setting('wp007.item_a2')::uuid,'partial','partial',now(),100"),
              ("gen_random_uuid(),current_setting('wp007.item_a3')::uuid,'skipped',now()", "gen_random_uuid(),current_setting('wp007.item_a3')::uuid,'planned','skipped',now()"),
              ("gen_random_uuid(),current_setting('wp007.item_a4')::uuid,'deferred',now()", "gen_random_uuid(),current_setting('wp007.item_a4')::uuid,'planned','deferred',now()"),
              ("gen_random_uuid(),current_setting('wp007.item_a5')::uuid,'cancelled',now()", "gen_random_uuid(),current_setting('wp007.item_a5')::uuid,'planned','cancelled',now()"),
              ("gen_random_uuid(),current_setting('wp007.item_a3')::uuid,'reopened',now()", "gen_random_uuid(),current_setting('wp007.item_a3')::uuid,'skipped','reopened',now()"),
          ]
          for old, new in replacements:
              s = replace_once(s, old, new, f'execution call {old}')

          publish_anchor = "select set_config('wp007.item_a5',(select id::text from public.daily_plan_items where plan_id=current_setting('wp007.plan_a')::uuid and task_id=current_setting('wp007.task_a5')::uuid),true);\n"
          publish_tests = """
select results_eq(
  $$select coalesce(nullif(current_setting('taskring.command_context', true),''),'')$$,
  $$values (''::text)$$,
  'publish restores command context after success'
);
select throws_ok(
  $$update public.daily_plans set brief='bypass' where id=current_setting('wp007.plan_a')::uuid$$,
  'P0001','Daily Plan mutations must use publish_daily_plan_v01.','direct Daily Plan mutation remains guarded after publish'
);
"""
          s = replace_once(s, publish_anchor, publish_anchor + publish_tests, 'publish restoration tests')

          done_anchor = """select results_eq(
  $$select status,remaining_minutes,completed_at from public.tasks where id=current_setting('wp007.task_a1')::uuid$$,
  $$values ('done'::text,0,'2026-08-28T09:00:00Z'::timestamptz)$$,
  'Done atomically projects Task done, zero remaining, completed_at'
);
"""
          done_tests = """
select results_eq(
  $$select coalesce(nullif(current_setting('taskring.command_context', true),''),'')$$,
  $$values (''::text)$$,
  'execution RPC restores command context after success'
);
select throws_ok(
  $$insert into public.task_events(id,user_id,task_id,plan_item_id,event_type,occurred_at,actor) values(gen_random_uuid(),current_setting('wp007.user_a')::uuid,current_setting('wp007.task_a1')::uuid,current_setting('wp007.item_a1')::uuid,'started',now(),'user')$$,
  'P0001','Execution mutations must use record_task_action_v01.','direct Event insert remains guarded after execution RPC'
);
select throws_ok(
  $$update public.daily_plan_items set current_state='started' where id=current_setting('wp007.item_a1')::uuid$$,
  'P0001','Daily Plan Item mutations must use an approved command boundary.','direct current_state update remains guarded after execution RPC'
);
select throws_ok(
  $$update public.tasks set status='active' where id=current_setting('wp007.task_a1')::uuid$$,
  'P0001','Execution projections must use record_task_action_v01.','direct execution-sensitive Task projection remains guarded after execution RPC'
);
"""
          s = replace_once(s, done_anchor, done_anchor + done_tests, 'execution restoration tests')

          feedback_anchor = """select results_eq(
  $$select user_id,task_id,plan_id,plan_item_id,content,source,ai_interpretation from public.user_feedback where id=current_setting('wp007.feedback')::uuid$$,
  $$values (current_setting('wp007.user_a')::uuid,current_setting('wp007.task_a2')::uuid,current_setting('wp007.plan_a')::uuid,current_setting('wp007.item_a2')::uuid,'Felt harder than expected'::text,'frontend'::text,null::jsonb)$$,
  'feedback ownership/references/source are server-derived and AI interpretation is null'
);
"""
          feedback_tests = """
select results_eq(
  $$select coalesce(nullif(current_setting('taskring.command_context', true),''),'')$$,
  $$values (''::text)$$,
  'feedback RPC restores command context after success'
);
"""
          s = replace_once(s, feedback_anchor, feedback_anchor + feedback_tests, 'feedback restoration test')

          # DEFECT-007-03: create/drop failure fixture as postgres, invoke command as authenticated.
          create_marker = "create or replace function public.wp007_force_event_failure()"
          s = replace_once(s, create_marker, "reset role;\n" + create_marker, 'failure fixture reset role')
          trigger_marker = "create trigger zz_wp007_force_event_failure before insert on public.task_events for each row execute function public.wp007_force_event_failure();"
          s = replace_once(s, trigger_marker, trigger_marker + "\nset local role authenticated;", 'failure fixture authenticated invoke')
          drop_marker = "drop trigger zz_wp007_force_event_failure on public.task_events;\ndrop function public.wp007_force_event_failure();"
          s = replace_once(s, drop_marker, "reset role;\n" + drop_marker + "\nset local role authenticated;", 'failure fixture postgres drop')

          old_reset = """reset role;
select set_config('taskring.command_context','execution:v1',true);
update public.daily_plan_items set current_state='planned' where id=current_setting('wp007.item_a1')::uuid;
select set_config('taskring.command_context','',true);
select set_config('request.jwt.claim.sub',current_setting('wp007.user_a'),true);"""
          new_reset = """reset role;
select set_config('wp007.fixture_previous_context',coalesce(current_setting('taskring.command_context',true),''),true);
select set_config('taskring.command_context','execution:v1',true);
update public.daily_plan_items set current_state='planned' where id=current_setting('wp007.item_a1')::uuid;
select set_config('taskring.command_context',current_setting('wp007.fixture_previous_context'),true);
select set_config('request.jwt.claim.sub',current_setting('wp007.user_a'),true);"""
          s = replace_once(s, old_reset, new_reset, 'test-only execution projection reset context')

          assertion_count = len(re.findall(r'(?m)^select (?:results_eq|ok|throws_ok|lives_ok)\(', s))
          s = re.sub(r'select plan\(\d+\);', f'select plan({assertion_count});', s, count=1)
          p.write_text(s)

          # WP006 pgTAP execution setup must use the formal command boundary.
          p = Path('supabase/tests/daily_plan_publication.test.sql')
          s = p.read_text()
          old = """update public.daily_plan_items
set current_state='started'
where plan_id=current_setting('wp006.plan2')::uuid
  and task_id=current_setting('wp006.task_a1')::uuid;
"""
          new = """select set_config(
  'wp006.execution_event',
  (select event_id::text from public.record_task_action_v01(
    gen_random_uuid(),
    (select id from public.daily_plan_items where plan_id=current_setting('wp006.plan2')::uuid and task_id=current_setting('wp006.task_a1')::uuid),
    'planned','started',now(),null,null,null,null,null
  )),
  true
);
"""
          s = replace_once(s, old, new, 'WP006 execution setup')
          p.write_text(s)

          # Existing Real Auth integrations now assert the tightened direct-write boundary.
          p = Path('tests/authDataApi.integration.test.ts')
          s = p.read_text()
          s = replace_once(s, 'expect(eventInsertError).toBeNull()', 'expect(eventInsertError).not.toBeNull()', 'Auth/Data API direct event guard')
          p.write_text(s)

          p = Path('tests/dailyPlanRpc.integration.test.ts')
          s = p.read_text()
          old = """    const { error: stateUpdateError } = await userAClient
      .from('daily_plan_items')
      .update({ current_state: 'started' })
      .eq('plan_id', second.planId)
      .eq('task_id', taskA1!.id)
    expect(stateUpdateError).toBeNull()
"""
          new = """    const { data: executionItem, error: executionItemError } = await userAClient
      .from('daily_plan_items')
      .select('id,current_state')
      .eq('plan_id', second.planId)
      .eq('task_id', taskA1!.id)
      .single()
    expect(executionItemError).toBeNull()
    const { error: directStateUpdateError } = await userAClient
      .from('daily_plan_items')
      .update({ current_state: 'started' })
      .eq('id', executionItem!.id)
    expect(directStateUpdateError).not.toBeNull()
    const { error: startExecutionError } = await userAClient.rpc('record_task_action_v01', {
      p_event_id: crypto.randomUUID(),
      p_plan_item_id: executionItem!.id,
      p_expected_state: 'planned',
      p_action: 'started',
    })
    expect(startExecutionError).toBeNull()
"""
          s = replace_once(s, old, new, 'WP006 integration execution setup')
          p.write_text(s)

          p = Path('tests/todayPage.test.tsx')
          s = p.read_text()
          s = replace_once(s, "expect(screen.queryByRole('checkbox')).toBeNull()", "expect(screen.queryByRole('checkbox')).toBeTruthy()", 'Today checkbox regression')
          s = replace_once(
              s,
              "expect(await screen.findByText('Execution has started; replanning is not supported by this stage.')).toBeTruthy()",
              "expect(await screen.findByText(/Execution has started\\. Plan history is locked/)).toBeTruthy()",
              'Today execution lock message',
          )
          s = s.replace('without execution controls or fake brief', 'with execution controls and no fake brief')
          p.write_text(s)

          # Required authenticated PostgREST anti-spoof proof: pg_catalog.set_config is not an exposed RPC.
          p = Path('tests/executionRpc.integration.test.ts')
          s = p.read_text()
          anchor = """    const userAId = signUpA.user!.id
    const userBId = signUpB.user!.id
"""
          anti_spoof = """

    for (const forbiddenContext of ['execution:v1', 'publication:v1', 'feedback:v1']) {
      const response = await fetch(`${url!}/rest/v1/rpc/set_config`, {
        method: 'POST',
        headers: {
          apikey: publishableKey!,
          Authorization: `Bearer ${signUpA.session!.access_token}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ setting_name: 'taskring.command_context', new_value: forbiddenContext, is_local: true }),
      })
      expect(response.ok).toBe(false)
    }
"""
          s = replace_once(s, anchor, anchor + anti_spoof, 'PostgREST context anti-spoof')
          s = replace_once(s, "occurredAt: '2026-08-28T11:00:00.000Z',", "occurredAt,", 'idempotent retry uses identical occurred_at')
          p.write_text(s)
          PY

      - name: Commit permanent reviewed corrections
        shell: bash
        run: |
          set -euo pipefail
          git add supabase/wp007_execution_events_feedback_v01.sql.source \
                  supabase/wp007_execution_events_feedback_v01.patch.sql.source \
                  supabase/tests/core_domain_schema.test.sql \
                  supabase/tests/execution_commands.test.sql \
                  supabase/tests/daily_plan_publication.test.sql \
                  tests/authDataApi.integration.test.ts \
                  tests/dailyPlanRpc.integration.test.ts \
                  tests/todayPage.test.tsx \
                  tests/executionRpc.integration.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'WP007: apply reviewed context and regression corrections'
          git push origin HEAD:feature/wp007-execution-events-feedback
