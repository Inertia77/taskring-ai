name: WP007 Migration Bootstrap

on:
  push:
    branches:
      - feature/wp007-execution-events-feedback

permissions:
  contents: write

jobs:
  generate-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert permanent correction sources and tests
        shell: bash
        run: |
          set -euo pipefail
          grep -F "v_previous_context text := pg_catalog.current_setting('taskring.command_context', true);" supabase/wp007_execution_events_feedback_v01.sql.source
          test "$(grep -F -c "v_previous_context text := pg_catalog.current_setting('taskring.command_context', true);" supabase/wp007_execution_events_feedback_v01.patch.sql.source)" -eq 2
          grep -F "publish restores command context after success" supabase/tests/execution_commands.test.sql
          grep -F "execution RPC restores command context after success" supabase/tests/execution_commands.test.sql
          grep -F "feedback RPC restores command context after success" supabase/tests/execution_commands.test.sql
          grep -F "rest/v1/rpc/set_config" tests/executionRpc.integration.test.ts
          ! grep -F "Align historical tests" .github/workflows/wp007-migration-bootstrap.yml

      - name: Generate formal Supabase migration
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec supabase migration new execution_events_feedback_v01
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_execution_events_feedback_v01.sql' -print | sort | tail -1)"
          test -n "$migration_file"
          cat supabase/wp007_execution_events_feedback_v01.sql.source supabase/wp007_execution_events_feedback_v01.patch.sql.source > "$migration_file"
          echo "MIGRATION_FILE=$migration_file" >> "$GITHUB_ENV"
          echo "Generated formal WP007 migration."

      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Rebuild and run database tests
        run: |
          pnpm exec supabase db reset --local
          pnpm exec supabase test db
          pnpm exec supabase db lint --level error --schema public

      - name: Run real Auth, Data API, Daily Plan, and Execution integrations
        shell: bash
        run: |
          set -euo pipefail
          env_file="$(mktemp)"
          pnpm exec supabase status -o env > "$env_file"
          api_url="$(sed -n 's/^API_URL="\([^"]*\)"$/\1/p' "$env_file")"
          publishable_key="$(sed -n 's/^PUBLISHABLE_KEY="\([^"]*\)"$/\1/p' "$env_file")"
          if [ -z "$publishable_key" ]; then
            publishable_key="$(sed -n 's/^ANON_KEY="\([^"]*\)"$/\1/p' "$env_file")"
          fi
          rm -f "$env_file"
          test -n "$api_url"
          test -n "$publishable_key"
          VITE_SUPABASE_URL="$api_url" VITE_SUPABASE_PUBLISHABLE_KEY="$publishable_key" \
            pnpm exec vitest run tests/authDataApi.integration.test.ts tests/dailyPlanRpc.integration.test.ts tests/executionRpc.integration.test.ts

      - name: Generate database types from local schema
        run: pnpm exec supabase gen types typescript --local > src/types/database.types.ts

      - name: Stop local Supabase before frontend verification
        run: |
          pnpm exec supabase stop --no-backup
          rm -rf supabase/.temp

      - name: Verify frontend and PWA with generated types
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm test:pwa

      - name: Cleanup local Supabase after failure
        if: failure()
        run: |
          pnpm exec supabase stop --no-backup || true
          rm -rf supabase/.temp

      - name: Commit verified migration and generated types, then self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm -f supabase/wp007_execution_events_feedback_v01.sql.source
          rm -f supabase/wp007_execution_events_feedback_v01.patch.sql.source
          rm -f scripts/wp007-correction-prep.py
          rm -f .github/workflows/wp007-migration-bootstrap.yml
          git add supabase/migrations src/types/database.types.ts supabase/tests tests \
                  supabase/wp007_execution_events_feedback_v01.sql.source \
                  supabase/wp007_execution_events_feedback_v01.patch.sql.source \
                  scripts/wp007-correction-prep.py \
                  .github/workflows/wp007-migration-bootstrap.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'WP007: generate verified execution boundary migration and types'
          git push origin HEAD:feature/wp007-execution-events-feedback
